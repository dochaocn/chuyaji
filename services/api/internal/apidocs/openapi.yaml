openapi: 3.0.3
info:
  title: 初芽记 chuyaji API
  version: "0.1.0"
  description: |
    家庭孕期与婴幼儿健康记录 HTTP API（Gin + SQLite）。

    **在线文档**：服务启动后浏览器打开 `/docs`（Stoplight Elements，支持 Try it）。

    **认证**：除登录、健康检查、公开附件外，请求头需携带 `Authorization: Bearer <JWT>`。
    登录接口 `POST /api/v1/auth/wechat` 的响应里返回 `token`。

    **开发**：当服务端 `CHUYAJI_DEV_MODE=true` 时，登录 body 可使用 `{"code":"dev"}` 走固定测试用户（勿用于生产）。

servers:
  - url: http://127.0.0.1:8282
    description: 本地默认（与 CHUYAJI_HTTP_ADDR 一致时可改）
  - url: /
    description: 相对当前访问的主机与端口

tags:
  - name: Meta
    description: 健康与文档
  - name: Auth
    description: 登录与当前用户
  - name: Family
    description: 家庭
  - name: Baby
    description: 宝宝
  - name: Record
    description: 记录
  - name: Attachment
    description: 附件与上传
  - name: Public
    description: 公开资源（无需 JWT）

paths:
  /healthz:
    get:
      tags: [Meta]
      summary: 健康检查
      responses:
        "200":
          description: 服务正常
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /api/v1/auth/wechat:
    post:
      tags: [Auth]
      summary: 微信 code 登录（或 dev code）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatLoginRequest"
      responses:
        "200":
          description: 成功，返回 JWT 与用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WechatLoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/me:
    get:
      tags: [Auth]
      summary: 当前用户信息
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/families:
    get:
      tags: [Family]
      summary: 当前用户所在家庭列表
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Family"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Family]
      summary: 创建家庭
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/families/join:
    post:
      tags: [Family]
      summary: 通过邀请码加入家庭
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinFamilyRequest"
      responses:
        "200":
          description: 成功（已加入或已是成员）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/families/{id}:
    get:
      tags: [Family]
      summary: 家庭详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/babies:
    get:
      tags: [Baby]
      summary: 某家庭下的宝宝列表
      security:
        - bearerAuth: []
      parameters:
        - name: family_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Baby"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Baby]
      summary: 创建宝宝
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBabyRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baby"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/babies/{id}:
    get:
      tags: [Baby]
      summary: 宝宝详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/babyIdPath"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baby"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Baby]
      summary: 更新宝宝
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/babyIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchBabyRequest"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baby"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Baby]
      summary: 删除宝宝
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/babyIdPath"
      responses:
        "204":
          description: 已删除
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/babies/{id}/records:
    get:
      tags: [Record]
      summary: 宝宝记录分页列表
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/babyIdPath"
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: cursor
          in: query
          description: 上一页响应中的 next_cursor
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Record"
                  next_cursor:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Record]
      summary: 新建记录
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/babyIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecordRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/records/{id}:
    get:
      tags: [Record]
      summary: 记录详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/recordIdPath"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Record]
      summary: 更新记录
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/recordIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchRecordRequest"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Record]
      summary: 删除记录（级联删除附件元数据）
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/recordIdPath"
      responses:
        "204":
          description: 已删除
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/records/{id}/attachments:
    get:
      tags: [Attachment]
      summary: 记录下的附件列表
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/recordIdPath"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Attachment]
      summary: 登记附件（URL 方式，非本地上传）
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/recordIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttachmentRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/records/{id}/attachments/upload:
    post:
      tags: [Attachment]
      summary: multipart 上传文件到服务器（需配置 CHUYAJI_UPLOAD_DIR）
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/recordIdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: 已保存并登记
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: 未启用本地上传（未设置 CHUYAJI_UPLOAD_DIR）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/attachments/{id}:
    delete:
      tags: [Attachment]
      summary: 删除附件
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/attachmentIdPath"
      responses:
        "204":
          description: 已删除
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/p/{token}:
    get:
      tags: [Public]
      summary: 通过 share_token 读取本机托管的附件文件（图片等）
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: 未找到

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    idPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: uint64
      description: 资源 ID（家庭）
    babyIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: uint64
      description: 宝宝 ID
    recordIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: uint64
      description: 记录 ID
    attachmentIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: uint64
      description: 附件 ID

  responses:
    BadRequest:
      description: 请求不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unauthorized:
      description: 未认证或 token 无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    ServerError:
      description: 服务器错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: string

    WechatLoginRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 微信 wx.login 的 code；开发模式可为 dev

    WechatLoginResponse:
      type: object
      properties:
        token:
          type: string
        expires_in:
          type: integer
          format: int64
          description: 秒
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        nickname:
          type: string
        avatar_url:
          type: string

    Family:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        name:
          type: string
        invite_code:
          type: string

    CreateFamilyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 64

    JoinFamilyRequest:
      type: object
      required: [invite_code]
      properties:
        invite_code:
          type: string

    Baby:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        family_id:
          type: integer
          format: uint64
        nickname:
          type: string
        lmp_date:
          type: string
          format: date-time
          nullable: true
        edd_date:
          type: string
          format: date-time
          nullable: true
        birth_date:
          type: string
          format: date-time
          nullable: true
        gender:
          type: string

    CreateBabyRequest:
      type: object
      required: [family_id, nickname]
      properties:
        family_id:
          type: integer
          format: uint64
        nickname:
          type: string
        lmp_date:
          type: string
          format: date-time
        edd_date:
          type: string
          format: date-time
        birth_date:
          type: string
          format: date-time
        gender:
          type: string

    PatchBabyRequest:
      type: object
      properties:
        nickname:
          type: string
        lmp_date:
          type: string
          format: date-time
        edd_date:
          type: string
          format: date-time
        birth_date:
          type: string
          format: date-time
        gender:
          type: string

    Record:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        baby_id:
          type: integer
          format: uint64
        phase:
          type: string
          enum: [prenatal, postnatal]
        record_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        gestational_weeks:
          type: integer
          nullable: true
        gestational_days:
          type: integer
          nullable: true
        summary:
          type: string
        payload:
          description: 任意 JSON 对象
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRecordRequest:
      type: object
      required: [phase, record_type, occurred_at]
      properties:
        phase:
          type: string
          enum: [prenatal, postnatal]
        record_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        gestational_weeks:
          type: integer
        gestational_days:
          type: integer
        summary:
          type: string
        payload:
          type: object
          additionalProperties: true

    PatchRecordRequest:
      type: object
      properties:
        phase:
          type: string
        record_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        gestational_weeks:
          type: integer
        gestational_days:
          type: integer
        summary:
          type: string
        payload:
          type: object
          additionalProperties: true

    Attachment:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        record_id:
          type: integer
          format: uint64
        url:
          type: string
        thumb_url:
          type: string
        sort_order:
          type: integer
        size:
          type: integer
          format: int64

    CreateAttachmentRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
        thumb_url:
          type: string
        sort_order:
          type: integer
        size:
          type: integer
          format: int64
