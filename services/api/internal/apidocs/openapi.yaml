openapi: 3.0.3
info:
  title: 初芽记 chuyaji API
  version: "0.2.0"
  description: |
    宝宝 / 宝妈双工作台 HTTP API（Gin + SQLite）。

    认证方式：除登录、健康检查、公开附件外，请求头需携带 `Authorization: Bearer <JWT>`。
    开发模式：当服务端 `CHUYAJI_DEV_MODE=true` 时，登录 body 可使用 `{"code":"dev"}`。

servers:
  - url: http://127.0.0.1:8282
    description: 本地默认
  - url: /
    description: 相对当前主机与端口

tags:
  - name: Meta
  - name: Auth
  - name: Baby
  - name: BabyRecord
  - name: Mother
  - name: MotherRecord
  - name: Dashboard
  - name: Attachment
  - name: Reminder
  - name: Public

paths:
  /healthz:
    get:
      tags: [Meta]
      summary: 健康检查
      responses:
        "200":
          description: 服务正常
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /api/v1/auth/wechat:
    post:
      tags: [Auth]
      summary: 微信 code 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatLoginRequest"
      responses:
        "200":
          description: 返回 JWT 与用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WechatLoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me:
    get:
      tags: [Auth]
      summary: 当前用户
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/babies:
    get:
      tags: [Baby]
      summary: 当前用户的宝宝列表
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Baby"
    post:
      tags: [Baby]
      summary: 创建宝宝档案
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBabyRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baby"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/babies/{id}:
    get:
      tags: [Baby]
      summary: 宝宝详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baby"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Baby]
      summary: 更新宝宝档案
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchBabyRequest"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baby"
    delete:
      tags: [Baby]
      summary: 删除宝宝档案
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "204":
          description: 已删除

  /api/v1/dashboard/baby:
    get:
      tags: [Dashboard]
      summary: 宝宝工作台聚合信息
      security:
        - bearerAuth: []
      parameters:
        - name: baby_id
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BabyDashboard"

  /api/v1/babies/{id}/records:
    get:
      tags: [BabyRecord]
      summary: 宝宝记录分页列表
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
        - $ref: "#/components/parameters/limitQuery"
        - $ref: "#/components/parameters/cursorQuery"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BabyRecordPage"
    post:
      tags: [BabyRecord]
      summary: 创建宝宝记录
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBabyRecordRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BabyRecord"

  /api/v1/records/{id}:
    get:
      tags: [BabyRecord]
      summary: 宝宝记录详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BabyRecord"
    patch:
      tags: [BabyRecord]
      summary: 更新宝宝记录
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchBabyRecordRequest"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BabyRecord"
    delete:
      tags: [BabyRecord]
      summary: 删除宝宝记录
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "204":
          description: 已删除

  /api/v1/mothers:
    get:
      tags: [Mother]
      summary: 当前用户的宝妈档案列表
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Mother"
    post:
      tags: [Mother]
      summary: 创建宝妈档案
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMotherRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mother"
        "409":
          description: 当前用户已存在档案

  /api/v1/mothers/{id}:
    get:
      tags: [Mother]
      summary: 宝妈档案详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mother"
    patch:
      tags: [Mother]
      summary: 更新宝妈档案
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMotherRequest"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mother"

  /api/v1/dashboard/mother:
    get:
      tags: [Dashboard]
      summary: 宝妈工作台聚合信息
      security:
        - bearerAuth: []
      parameters:
        - name: mother_id
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MotherDashboard"

  /api/v1/mothers/{id}/records:
    get:
      tags: [MotherRecord]
      summary: 宝妈记录分页列表
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
        - $ref: "#/components/parameters/limitQuery"
        - $ref: "#/components/parameters/cursorQuery"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MotherRecordPage"
    post:
      tags: [MotherRecord]
      summary: 创建宝妈记录
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMotherRecordRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MotherRecord"

  /api/v1/mother-records/{id}:
    get:
      tags: [MotherRecord]
      summary: 宝妈记录详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MotherRecord"
    patch:
      tags: [MotherRecord]
      summary: 更新宝妈记录
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMotherRecordRequest"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MotherRecord"
    delete:
      tags: [MotherRecord]
      summary: 删除宝妈记录
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "204":
          description: 已删除

  /api/v1/records/{id}/attachments:
    get:
      tags: [Attachment]
      summary: 宝宝记录附件列表
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentPage"
    post:
      tags: [Attachment]
      summary: 宝宝记录登记附件 URL
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttachmentRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"

  /api/v1/mother-records/{id}/attachments:
    get:
      tags: [Attachment]
      summary: 宝妈记录附件列表
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentPage"
    post:
      tags: [Attachment]
      summary: 宝妈记录登记附件 URL
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttachmentRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"

  /api/v1/records/{id}/attachments/upload:
    post:
      tags: [Attachment]
      summary: 上传宝宝记录附件
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: 已上传
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"

  /api/v1/mother-records/{id}/attachments/upload:
    post:
      tags: [Attachment]
      summary: 上传宝妈记录附件
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: 已上传
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"

  /api/v1/attachments/{id}:
    delete:
      tags: [Attachment]
      summary: 删除附件
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "204":
          description: 已删除

  /api/v1/reminders:
    get:
      tags: [Reminder]
      summary: 当前用户提醒列表
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, done, ignored]
            default: pending
        - name: owner_type
          in: query
          schema:
            type: string
            enum: [baby, mother]
        - name: owner_id
          in: query
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reminder"

  /api/v1/reminders/{id}:
    patch:
      tags: [Reminder]
      summary: 更新提醒状态
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, done, ignored]
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
    delete:
      tags: [Reminder]
      summary: 删除提醒
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "204":
          description: 已删除

  /api/v1/p/{token}:
    get:
      tags: [Public]
      summary: 匿名读取服务端托管附件
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 返回文件流
        "404":
          description: 不存在

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    idPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    limitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    cursorQuery:
      name: cursor
      in: query
      schema:
        type: string

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 无权访问
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    WechatLoginRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 微信登录 code，开发模式可传 dev

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
        avatar_url:
          type: string

    WechatLoginResponse:
      type: object
      properties:
        token:
          type: string
        expires_in:
          type: integer
          format: int64
        user:
          $ref: "#/components/schemas/User"

    Baby:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        nickname:
          type: string
        gender:
          type: string
        lmp_date:
          type: string
          format: date-time
        edd_date:
          type: string
          format: date-time
        birth_date:
          type: string
          format: date-time
        birth_weight_g:
          type: integer
        birth_height_cm:
          type: number
        birth_hospital:
          type: string
        feeding_type:
          type: string
        note:
          type: string

    CreateBabyRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
        gender:
          type: string
        lmp_date:
          type: string
          format: date-time
        edd_date:
          type: string
          format: date-time
        birth_date:
          type: string
          format: date-time
        birth_weight_g:
          type: integer
        birth_height_cm:
          type: number
        birth_hospital:
          type: string
        feeding_type:
          type: string
        note:
          type: string

    PatchBabyRequest:
      allOf:
        - $ref: "#/components/schemas/CreateBabyRequest"

    BabyRecord:
      type: object
      properties:
        id:
          type: integer
          format: int64
        baby_id:
          type: integer
          format: int64
        phase:
          type: string
          enum: [prenatal, postnatal]
        record_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        summary:
          type: string
        payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateBabyRecordRequest:
      type: object
      required: [phase, record_type, occurred_at]
      properties:
        phase:
          type: string
          enum: [prenatal, postnatal]
        record_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        summary:
          type: string
        payload:
          type: object
          additionalProperties: true

    PatchBabyRecordRequest:
      allOf:
        - $ref: "#/components/schemas/CreateBabyRecordRequest"

    BabyRecordPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BabyRecord"
        next_cursor:
          type: string

    Mother:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        name:
          type: string
        birthday:
          type: string
          format: date-time
        height_cm:
          type: number
        pre_pregnancy_weight_kg:
          type: number
        blood_type:
          type: string
        allergy_history:
          type: string
        medical_history:
          type: string
        status:
          type: string
          enum: [pregnant, postpartum, parenting]
        delivery_date:
          type: string
          format: date-time
        note:
          type: string

    CreateMotherRequest:
      type: object
      properties:
        name:
          type: string
        birthday:
          type: string
          format: date-time
        height_cm:
          type: number
        pre_pregnancy_weight_kg:
          type: number
        blood_type:
          type: string
        allergy_history:
          type: string
        medical_history:
          type: string
        status:
          type: string
          enum: [pregnant, postpartum, parenting]
        delivery_date:
          type: string
          format: date-time
        note:
          type: string

    PatchMotherRequest:
      allOf:
        - $ref: "#/components/schemas/CreateMotherRequest"

    MotherRecord:
      type: object
      properties:
        id:
          type: integer
          format: int64
        mother_id:
          type: integer
          format: int64
        record_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        summary:
          type: string
        payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateMotherRecordRequest:
      type: object
      required: [record_type, occurred_at]
      properties:
        record_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        summary:
          type: string
        payload:
          type: object
          additionalProperties: true

    PatchMotherRecordRequest:
      allOf:
        - $ref: "#/components/schemas/CreateMotherRecordRequest"

    MotherRecordPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MotherRecord"
        next_cursor:
          type: string

    Attachment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        owner_type:
          type: string
          enum: [baby_record, mother_record]
        owner_id:
          type: integer
          format: int64
        url:
          type: string
        thumb_url:
          type: string
        sort_order:
          type: integer
        size:
          type: integer
          format: int64

    AttachmentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"

    CreateAttachmentRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
        thumb_url:
          type: string
        sort_order:
          type: integer
        size:
          type: integer
          format: int64

    Reminder:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        owner_type:
          type: string
          enum: [baby, mother]
        owner_id:
          type: integer
          format: int64
        source_type:
          type: string
          enum: [baby_record, mother_record]
